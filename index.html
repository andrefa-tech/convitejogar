<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um convite para Maria 💜</title>
  <style>
    :root { --pink: #ff7bd5; --white: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white); background: #160626;
    }
    .video-bg {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -3;
    }
    .overlay {
      position: fixed; inset: 0; z-index: -2;
      background: linear-gradient(135deg, rgba(15,5,35,.68), rgba(43,7,79,.60));
    }
    .glow {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(176,91,255,.18), transparent 55%);
    }
    .card {
      position: relative; z-index: 1; width: min(92vw, 560px);
      padding: 38px 28px 34px; text-align: center;
      border: 1px solid rgba(255,255,255,.25); border-radius: 26px;
      background: rgba(19,8,39,.76);
      box-shadow: 0 20px 70px rgba(0,0,0,.45), 0 0 35px rgba(157,78,221,.18);
      backdrop-filter: blur(10px);
    }
    .eyebrow { margin: 0 0 12px; color: #e8c7ff; font-size: .85rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.08; text-shadow: 0 0 24px rgba(255,123,213,.35); }
    .message { margin: 18px auto 28px; max-width: 420px; color: #f1e8ff; font-size: clamp(1rem, 3.5vw, 1.15rem); line-height: 1.65; }
    .name { color: var(--pink); }
    .buttons { position: relative; display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 58px; margin-top: 8px; }
    button { border: 0; border-radius: 999px; padding: 14px 26px; min-width: 130px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #yes { color: #2a0b3d; background: linear-gradient(135deg, #ffb3e6, #c9a0ff); box-shadow: 0 7px 25px rgba(255,123,213,.3); }
    #yes:hover { transform: translateY(-3px) scale(1.04); }
    #no { color: white; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.32); z-index: 5; }
    .hint { margin: 22px 0 0; color: #d8c5f0; font-size: .85rem; }
    .result { display: none; margin-top: 22px; color: #ffd3f0; font-weight: 700; line-height: 1.6; }
    .hearts { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .heart { position: absolute; bottom: -30px; animation: floatUp 3.8s ease-in forwards; opacity: .95; filter: drop-shadow(0 0 8px rgba(255,123,213,.55)); }
    @keyframes floatUp { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
    @media (max-width: 420px) { .card { padding: 32px 18px; } .buttons { gap: 10px; } button { min-width: 112px; padding: 13px 18px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="fundo.mp4" type="video/mp4">
    Seu navegador não suporta vídeo em segundo plano.
  </video>
  <div class="overlay"></div>
  <div class="glow"></div>
  <main class="card">
    <p class="eyebrow">Convite oficial ✦</p>
    <h1>Maria, bora jogar<br><span class="name">quarta-feira?</span></h1>
    <p class="message">
      Tenho uma proposta muito importante pra você… 💜<br>
      Uma partidinha comigo na quarta-feira. Topa?
    </p>
    <div class="buttons" id="buttons">
      <button id="yes" type="button">SIM! 💜</button>
      <button id="no" type="button">Não 😶</button>
    </div>
    <p class="hint" id="hint">Escolha com carinho… 👀</p>
    <p class="result" id="result">EU SABIA! 💜🎮<br>Quarta-feira temos um encontro marcado no jogo. 😎</p>
  </main>
  <div class="hearts" id="hearts"></div>
  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const hint = document.getElementById("hint");
    const result = document.getElementById("result");
    let escapes = 0;

    function runAway() {
      escapes++;
      noButton.style.position = "fixed";
      const margin = 16;
      const maxX = Math.max(margin, window.innerWidth - noButton.offsetWidth - margin);
      const maxY = Math.max(margin, window.innerHeight - noButton.offsetHeight - margin);
      noButton.style.left = (margin + Math.random() * (maxX - margin)) + "px";
      noButton.style.top = (margin + Math.random() * (maxY - margin)) + "px";
      const messages = [
        "Opa, quase! 😂",
        "Esse botão é rápido demais 👀",
        "Acho que ele quer que você diga sim 💜",
        "Maria, não adianta fugir da pergunta 😭",
        "O botão NÃO pediu demissão 🏃"
      ];
      hint.textContent = messages[Math.min(escapes - 1, messages.length - 1)];
    }

    noButton.addEventListener("pointerenter", runAway);
    noButton.addEventListener("click", runAway);
    noButton.addEventListener("touchstart", (event) => {
      event.preventDefault();
      runAway();
    }, { passive: false });

    yesButton.addEventListener("click", () => {
      result.style.display = "block";
      hint.textContent = "Resposta registrada com sucesso. ✔";
      yesButton.textContent = "COMBINADO! 💜";
      noButton.style.display = "none";
      for (let i = 0; i < 28; i++) {
        setTimeout(() => {
          const heart = document.createElement("span");
          heart.className = "heart";
          heart.textContent = ["💜", "✨", "🎮", "💕"][Math.floor(Math.random() * 4)];
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = (16 + Math.random() * 20) + "px";
          heart.style.animationDuration = (2.5 + Math.random() * 2) + "s";
          document.getElementById("hearts").appendChild(heart);
          setTimeout(() => heart.remove(), 5000);
        }, i * 70);
      }
    });

    window.addEventListener("resize", () => {
      if (noButton.style.position === "fixed") {
        const x = Math.min(parseFloat(noButton.style.left) || 16, window.innerWidth - noButton.offsetWidth - 8);
        const y = Math.min(parseFloat(noButton.style.top) || 16, window.innerHeight - noButton.offsetHeight - 8);
        noButton.style.left = Math.max(8, x) + "px";
        noButton.style.top = Math.max(8, y) + "px";
      }
    });
  </script>
</body>
</html>
